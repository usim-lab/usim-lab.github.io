# 구글 사이트(sites.google.com/view/uksim) → https://usim-lab.github.io 자동 동기화 + 배포
# - 6시간마다: 구글 사이트를 읽어 data/ 와 assets/img/ 를 갱신하고, 바뀐 게 있을 때만 커밋합니다.
#   그 뒤 main 의 최신 커밋이 배포 완료 상태가 아니면 배포 전용 실행을 띄웁니다 (앞선 배포가 실패했을 때도 복구됩니다).
# - main 에 직접 올리면(push): 동기화 없이 바로 배포합니다.
# - 매주 일요일 새벽(03:30 KST): 사진까지 전부 다시 받아 "같은 자리에서 교체된 사진"도 반영합니다.
# - Actions 탭 → "Sync & Deploy" → Run workflow 로 즉시 동기화 + 배포할 수 있습니다 (full 체크 시 사진 전체 갱신).
name: Sync & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
    - cron: "30 18 * * 6"
  workflow_dispatch:
    inputs:
      full:
        description: "사진까지 전부 다시 받기 (교체한 사진이 안 바뀔 때)"
        type: boolean
        default: false
      deploy_only:
        description: "동기화 없이 현재 main 을 배포만 하기"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' && !inputs.deploy_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 lxml pillow
      - run: python3 sync/sync_site.py --workers 8 ${{ (github.event.schedule == '30 18 * * 6' || inputs.full) && '--full' || '' }}
      - name: Translate new text (KO ⇄ EN, free Workers AI)
        # new sentences added on the Google Site get an English/Korean version automatically
        if: ${{ vars.AI_ENDPOINT != '' }}
        continue-on-error: true
        env:
          I18N_TOKEN: ${{ secrets.I18N_TOKEN }}
        run: python3 sync/i18n.py --auto "${{ vars.AI_ENDPOINT }}/translate"
      - run: python3 sync/i18n.py --build
      - name: Commit changes
        # GitHub 쪽 일시 오류로 push 가 거부되면 기다렸다가 다시 시도합니다. 끝내 안 되면 실패로 끝납니다.
        run: |
          git config user.name "neel-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data assets/img
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "sync: Google Sites $(date -u +'%Y-%m-%d %H:%M UTC')"
          for delay in 30 60 120 0; do
            git push && exit 0
            [ "$delay" -gt 0 ] || break
            echo "push failed, retrying in ${delay}s"
            sleep "$delay"
            git pull --rebase origin main || git rebase --abort || true
          done
          echo "::error::push failed after 4 attempts"
          exit 1
      # 배포 버전 번호는 실행이 시작될 때의 커밋으로 정해집니다. 같은 실행에서 방금 만든 커밋을 배포하면 번호가
      # 앞선 배포와 겹쳐, 성공으로 표시되고도 사이트에 반영되지 않을 수 있습니다. 그래서 배포는 새 실행에서 합니다.
      - name: Deploy if the site is behind main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          status=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$head" --jq .status 2>/dev/null || true)
          echo "pages deployment of $head: ${status:-none}"
          [ "$status" = succeed ] || gh workflow run site.yml --ref main -f deploy_only=true

  # 업로드와 배포를 다른 job 으로 나눕니다. 같은 job 에서 업로드 직후 바로 배포하면
  # GitHub 가 방금 올린 사진 묶음(artifact)을 아직 못 찾아 실패하는 경우가 있습니다.
  build:
    if: github.event_name == 'push' || inputs.deploy_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying (temporary GitHub error)
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
