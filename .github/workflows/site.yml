# 구글 사이트(sites.google.com/view/uksim) → https://usim-lab.github.io 자동 동기화 + 배포
# - 6시간마다: 구글 사이트를 읽어 data/ 와 assets/img/ 를 갱신하고, 바뀐 게 있으면 커밋 후 배포합니다.
# - main 에 직접 올리면(push): 동기화 없이 바로 배포합니다.
# - 매주 일요일 새벽(03:30 KST): 사진까지 전부 다시 받아 "같은 자리에서 교체된 사진"도 반영합니다.
# - Actions 탭 → "Sync & Deploy" → Run workflow 로 즉시 동기화 + 배포할 수 있습니다 (full 체크 시 사진 전체 갱신).
name: Sync & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
    - cron: "30 18 * * 6"
  workflow_dispatch:
    inputs:
      full:
        description: "사진까지 전부 다시 받기 (교체한 사진이 안 바뀔 때)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 lxml pillow
      - run: python3 sync/sync_site.py --workers 8 ${{ (github.event.schedule == '30 18 * * 6' || inputs.full) && '--full' || '' }}
      - name: Translate new text (KO ⇄ EN, free Workers AI)
        # new sentences added on the Google Site get an English/Korean version automatically
        if: ${{ vars.AI_ENDPOINT != '' }}
        continue-on-error: true
        env:
          I18N_TOKEN: ${{ secrets.I18N_TOKEN }}
        run: python3 sync/i18n.py --auto "${{ vars.AI_ENDPOINT }}/translate"
      - run: python3 sync/i18n.py --build
      - name: Commit changes
        id: commit
        run: |
          git config user.name "neel-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data assets/img
          if git diff --cached --quiet; then
            echo "no changes"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync: Google Sites $(date -u +'%Y-%m-%d %H:%M UTC')" && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # 업로드와 배포를 다른 job 으로 나눕니다. 같은 job 에서 업로드 직후 바로 배포하면
  # GitHub 가 방금 올린 사진 묶음(artifact)을 아직 못 찾아 실패하는 경우가 있습니다.
  build:
    needs: sync
    if: >-
      !cancelled() && needs.sync.result != 'failure' &&
      (github.event_name != 'schedule' || needs.sync.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    # push 때는 sync 가 생략되므로 기본 조건(success)이면 deploy 까지 생략됩니다 → build 결과만 봅니다.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying (temporary GitHub error)
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
