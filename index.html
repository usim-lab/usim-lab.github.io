<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="NEEL Laboratory — Nanomaterials for Energy and Environment, led by Prof. Uk Sim (SKKU SAINT). Green hydrogen, electrocatalysis, ammonia, batteries.">
<meta name="theme-color" content="#fbfbfd">
<title>NEEL Lab · Nanomaterials for Energy & Environment</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230a84ff'/%3E%3Cstop offset='.5' stop-color='%235e5ce6'/%3E%3Cstop offset='1' stop-color='%23ff2d55'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='-apple-system,Helvetica,Arial' font-weight='800' font-size='34' fill='white'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/neel.css">
<link rel="preload" as="image" href="assets/img/neel-logo.svg">
</head>
<body>

<!-- ═══════ LANGUAGE SELECT (first visit) ═══════ -->
<div id="lang-modal" class="hide">
  <div class="bg"></div>
  <div class="blob ba" style="width:520px;height:520px;top:12%;left:12%;"></div>
  <div class="blob bb" style="width:460px;height:460px;bottom:12%;right:12%;"></div>
  <div class="blob be" style="width:380px;height:380px;top:50%;left:50%;transform:translate(-50%,-50%);"></div>
  <div class="content">
    <p class="wel">Welcome to</p>
    <h1 class="display ink-grad">NEEL Lab</h1>
    <p class="muted">Choose your language · 언어를 선택하세요</p>
    <div class="lang-choices">
      <button class="lang-choice lg lg-thick refract" data-lang="ko"><span class="flag">🇰🇷</span><div class="name">한국어</div><div class="sub">Korean</div></button>
      <button class="lang-choice lg lg-thick refract" data-lang="en"><span class="flag">🇺🇸</span><div class="name">English</div><div class="sub">영어</div></button>
    </div>
    <p class="small muted" style="margin-top:36px;font-size:11px">You can switch anytime from the top bar.</p>
  </div>
</div>

<!-- ═══════ NAV (built by app.js from the mirrored Google-Sites menu) ═══════ -->
<nav class="nav" id="nav"></nav>
<div class="mobile-menu" id="mobile-menu"></div>

<!-- ═══════ PAGE ═══════ -->
<main id="app"></main>
<footer class="footer" id="footer"></footer>

<!-- ═══════ LIGHTBOX ═══════ -->
<div id="lightbox" aria-hidden="true">
  <span class="lb-count" id="lb-count"></span>
  <button class="lb-close" id="lb-close" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-next" id="lb-next" aria-label="Next">›</button>
  <div class="lb-cap" id="lb-cap"></div>
</div>

<!-- ═══════ ASSISTANT / SEARCH ═══════ -->
<button id="chat-toggle" aria-label="Search NEEL">
  <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35" stroke-linecap="round"/></svg>
</button>
<div id="chat-panel">
  <div class="chat-head">
    <img class="chat-avatar" src="assets/img/neel-logo.svg" alt="N">
    <div style="flex:1;min-width:0"><h3>NEEL Assistant</h3><p id="chat-sub">논문 · 구성원 · 수상 · 특허 · 연구주제를 검색합니다</p></div>
    <div class="chat-modes" id="chat-modes"></div>
  </div>
  <div class="chat-scroll" id="chat-scroll"></div>
  <div class="chat-sug" id="chat-sug"></div>
  <div class="chat-input">
    <input id="chat-input" type="text" placeholder="검색어를 입력하세요…" autocomplete="off">
    <button class="send" id="chat-send" aria-label="Send"><svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<!-- ═══════ HOVER "ASK AI" PILL ═══════ -->
<div id="ai-pill" role="button"><span class="ai-spark">✨</span><span id="ai-pill-text">Ask AI</span></div>

<!-- ═══════ TEXT EDITOR (design texts only) ═══════ -->
<div id="edit-panel"><div class="bg" id="edit-bg"></div><div class="sheet" id="edit-sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="data/content.js"></script>
<script src="data/overrides.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
